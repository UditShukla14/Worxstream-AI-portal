# nginx site for the notification backend. Replace server_name, then:
#   sudo cp deploy/nginx-notifications.conf /etc/nginx/sites-available/notifications
#   sudo ln -s /etc/nginx/sites-available/notifications /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d notifications.worxstream.ai     # adds TLS
server {
    listen 80;
    server_name notifications.worxstream.ai;

    location / {
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        # Socket.IO websocket upgrade
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
