# DigitalOcean App Platform: Worxstream AI hub (agent). Only needed if moving it off the droplet.
# Fill the secret values in the dashboard; copy the names from agent/.env.example.
name: worxstream-ai-hub
region: nyc

services:
  - name: ai-hub
    github:
      repo: invoicehubplus/Worxstream-AI-portal
      branch: dev_Udit
      deploy_on_push: true
    source_dir: /agent
    environment_slug: node-js
    # Builds the /admin dashboard that the server serves statically.
    build_command: npm install --prefix admin-dashboard && npm run build --prefix admin-dashboard
    run_command: npm start
    http_port: 8080
    instance_count: 1
    instance_size_slug: basic-xs
    health_check:
      http_path: /health
      initial_delay_seconds: 30
    envs:
      - key: NODE_ENV
        value: production
      - key: ANTHROPIC_API_KEY
        type: SECRET
      - key: MONGODB_URL
        type: SECRET
      - key: WORXSTREAM_API_TOKEN
        type: SECRET
      - key: WORXSTREAM_BASE_URL
        value: https://api.worxstream.ai
      - key: NOTIFICATION_API_URL
        value: https://REPLACE-WITH-NOTIFICATION-APP-URL
      - key: NOTIFICATION_SERVICE_KEY
        type: SECRET
